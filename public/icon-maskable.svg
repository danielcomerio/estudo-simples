<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Estudo Simples">
  <defs>
    <linearGradient id="es-mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="es-mg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Maskable: fundo verde escuro preenche o canvas inteiro pra qualquer
       shape que o OS aplique (square, circle, squircle, etc). Conteúdo
       fica em 80% central (safe zone do maskable spec). -->
  <rect width="192" height="192" fill="#0b1220"/>
  <!-- Anel tracejado (ciclo SRS) -->
  <circle cx="96" cy="96" r="60" stroke="#22c55e" stroke-width="4" fill="none"
          stroke-dasharray="6 8" opacity="0.42" stroke-linecap="round"/>
  <!-- Disco principal verde (60% do canvas) -->
  <circle cx="96" cy="96" r="48" fill="url(#es-mg)"/>
  <circle cx="96" cy="96" r="48" fill="url(#es-mg2)" opacity="0.18"/>
  <!-- Check central -->
  <path d="M 72 96 L 90 114 L 124 78"
        stroke="#062013" stroke-width="11" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
